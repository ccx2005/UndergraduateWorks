<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面宠物 · 凯尔希</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: grab;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  body.dragging { cursor: grabbing; }

  #pet-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .pet-body {
    transition: transform 0.2s ease-out;
  }

  .pet-body.dragging { transform: scale(1.05); }

  /* Idle bobbing */
  @keyframes idleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes idleTail {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }

  /* Sleep animation */
  @keyframes sleepBreathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.03, 0.97); }
  }

  /* Happy wiggle */
  @keyframes happyWiggle {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-8deg) translateY(-4px); }
    75% { transform: rotate(8deg) translateY(-4px); }
  }

  /* Eating */
  @keyframes eatNod {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  /* Floating hearts */
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    50% { opacity: 1; transform: translateY(-25px) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
  }

  @keyframes zzzFloat {
    0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
    50% { opacity: 1; transform: translate(15px, -20px) scale(1); }
    100% { opacity: 0; transform: translate(30px, -40px) scale(1.1); }
  }

  .effect {
    position: absolute;
    pointer-events: none;
  }

  .heart {
    animation: floatUp 1.2s ease-out forwards;
  }

  .zzz {
    animation: zzzFloat 2s ease-out forwards;
  }

  /* Pet name label */
  #name-label {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    font-family: sans-serif;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #pet-container:hover #name-label {
    opacity: 1;
  }

  /* Click notification */
  #click-hint {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 10px;
    padding: 2px 10px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
</style>
</head>
<body>

<div id="pet-container">
  <svg id="pet-svg" viewBox="0 0 120 140" width="120" height="140">
    <!-- Shadow (stays on ground, not in pet-body) -->
    <ellipse id="shadow" cx="60" cy="128" rx="30" ry="6" fill="rgba(0,0,0,0.15)"/>

    <!-- All pet parts wrapped for unified animation -->
    <g class="pet-body" style="transform-origin: 60px 80px;">

    <!-- Kal'tsit pixel art sprite (replaces original orange cat) -->
    <image id="kaltist-sprite" href="../assets/kaltist.png"
           x="6" y="14" width="108" height="118"
           preserveAspectRatio="xMidYMid meet"
           style="image-rendering: pixelated; image-rendering: crisp-edges;"/>

    </g><!-- end pet-body -->
  </svg>

  <div id="name-label">凯尔希 · 拖拽移动 | 点击抚摸</div>
  <div id="click-hint"></div>
  <div id="effects-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
</div>

<script src="renderer.js"></script>
</body>
</html>
